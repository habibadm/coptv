name: Imágenes

# Arma las imágenes Docker del panel y de la API (con la app de TV) para servidores x86 (como el Asustor AS6510T).
on:
  push:
    branches: [main]
    paths: ['services/api/**', 'services/cms/**', 'apps/tv-web/**', 'packages/shared/**', 'package-lock.json', '.github/workflows/imagenes.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: coptv-api
            context: .
            file: services/api/Dockerfile
          - name: coptv-panel
            context: services/cms
            file: services/cms/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
